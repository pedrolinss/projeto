<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevLinks</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div id="container">
      <div id="profile">
        <img src="./assets/pfp.jpg" alt="Foto de Pedro Lins" />
        <p>@pedrolinss__</p>
      </div>

      <div id="switch" onclick="toggleMode()">
        <button>
          <img src="" alt="" />
        </button>
        <span></span>
      </div>

      <ul>
        <li>
          <a href="./assets/Currículo.pdf" target="_blank">Meu currículo</a>
        </li>

        <li>
          <a
            href="https://drive.google.com/drive/u/2/folders/1w4z-2msCKtxUsf55ZULkjBnKOapmd3YK"
            target="_blank"
            >Certificados</a
          >
        </li>
      </ul>

      <div id="social-links">
        <a href="https://github.com/pedrolinss" target="_blank">
          <ion-icon name="logo-github"></ion-icon>
        </a>
        <a href="https://instagram.com/pedrolinss__" target="_blank">
          <ion-icon name="logo-instagram"></ion-icon>
        </a>
        <a
          href="https://www.linkedin.com/in/pedro-lins-838b80263/"
          target="_blank"
        >
          <ion-icon name="logo-linkedin"></ion-icon>
        </a>
      </div>

      <footer>
        Feito por
        <a href="https://instagram.com/pedrolinss__" target="_blank"
          >Pedro Lins</a
        >
      </footer>
    </div>

    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>

    <script src="./script.js"></script>
  </body>
</html>
